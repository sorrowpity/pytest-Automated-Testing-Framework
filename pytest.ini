[pytest]

# 运行run文件，run在根目录，要以run.py文件为主视角进行相对路径
# 日志有两个出口，1.文件，2.控制台
log_file = ./log/test.log
log_file_level = info
log_file_format = %(asctime)s %(filename)-16s [函数:%(funcName)-18s] [line:%(lineno)-3d] %(levelname)s -- %(message)s  
#asctime：当前的时间,levelname：日志级别,message日志返回信息，lineno行号，s表示字符串形式,d数字形式
# 在文件日志信息中输出的格式
# -表示左对齐，20表示占据20个字符，如果未满20则用空格补全
log_file_date_format = %Y-%m-%d %H:%M:%S #日志时间格式化


# 控制台控制，True 打开控制台输出
log_cli = True
log_cli_level = info
log_cli_format = %(asctime)s %(filename)-16s [函数:%(funcName)-18s] [line:%(lineno)-3d] %(levelname)s -- %(message)s  
#控制台格式
log_cli_date_format = %Y-%m-%d %H:%M:%S